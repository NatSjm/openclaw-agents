name: research-team

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.8
    init: true
    restart: unless-stopped
    working_dir: /project
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      XDG_CACHE_HOME: /home/node/.openclaw/cache
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      TZ: "${TZ:-Europe/Kyiv}"
    # Private values: model key, Telegram token, dashboard and A2A tokens.
    # Created by setup.ps1 from .env.example; ignored by Git.
    env_file: .local/openclaw.env
    volumes:
      # Sessions, auth profiles, pairing approvals and the live config.
      - openclaw-state:/home/node/.openclaw
      # Live agent workspaces (instructions, memory, reports) on a Linux
      # volume: OpenClaw's atomic file writes fail on Windows bind mounts.
      - openclaw-workspace:/project/openclaw/workspace
      # Read-only inputs for docker/init.py, which syncs the tracked
      # instructions from workspace-src into the volume on every setup.
      - ./openclaw/workspace:/project/workspace-src:ro
      - ./config:/project/config:ro
      - ./docker:/project/docker:ro
    ports:
      - "127.0.0.1:18789:18789"
    depends_on:
      - jaeger
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: [no-new-privileges:true]
    command: [openclaw, gateway, --bind, lan, --port, "18789"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  # Observability: receives OpenTelemetry traces from OpenClaw (OTLP/HTTP 4318)
  # and shows runs, model calls, tool calls, delegations and errors.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  openclaw-state:
  openclaw-workspace:
